uniform.float.boltOn   = if(lightningBoltPosition.w > 0.5, 1, 0)
uniform.float.boltFade = smooth(1, boltOn, 0.4, 0.05)
uniform.float.boltGlow = smooth(3, boltOn, 0.01, 0.35)
# how far the bolt is: 0 within 300 blocks, 0.53 at 2 km, 0.87 at 10 km (distant strikes from the mod)
# rises instantly and fades slowly, so the flash tail after the bolt is gone stays dim too
uniform.float.boltFar  = smooth(4, if(boltOn > 0.5, 1 - 1 / (1 + max(sqrt(lightningBoltPosition.x * lightningBoltPosition.x + lightningBoltPosition.z * lightningBoltPosition.z) - 300, 0) / 1500), 0), 0.01, 1.5)

# portal light buffer (Iris only)
bufferObject.0 = 64
# held item light buffer (Iris only)
bufferObject.1 = 848
# ore light buffer (Iris only), only allocated with ORE_LIGHT
#ifdef ORE_LIGHT
bufferObject.2 = 1310720
#endif
# per-frame sky values for vertex shaders (Iris only)
bufferObject.3 = 48
iris.features.optional = SSBO
